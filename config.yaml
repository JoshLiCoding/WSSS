# Training Configuration for CLIP WSSS
# Weakly Supervised Semantic Segmentation using OpenAI CLIP

# Model Parameters
model:
  num_classes: 21
  clip_model_name: "ViT-L/14"
  num_transformer_blocks: 1
  num_conv_blocks: 2
  out_channels: 21
  use_bottleneck: false
  use_transpose_conv: false

# Training Parameters
training:
  batch_size: 16
  num_epochs: 10
  learning_rate: 0.001
  weight_decay: 0.0001
  momentum: 0.9
  ignore_index: 255
  validation_interval: 2
  train_only: false

# Loss Parameters
loss:
  potts_type: 'quadratic'
  contour_method: 'sam'  # 'sam', 'fastsam', 'gt', 'color_diff'

# Dataset Parameters
dataset:
  dataset_name: 'voc'
  n_images: -1
  root: '.'
  train_image_set: 'train'
  val_image_set: 'val'
  download: false

# Directory Structure
directories:
  output: 'output_29_upsampling_order'
  checkpoints: 'checkpoints'
  visualizations: 'vis_{num_epochs}epochs_t=0.05mm_w=mixed_dl=5_sam_0t0c'

# File Paths
paths:
  model_checkpoint: 'output_29_upsampling_order/checkpoints/10epochs_t=0.05mm_kl_0t0c.pt'
  model: 'output_29_upsampling_order/checkpoints/{num_epochs}epochs_t=0.05mm_w=mixed_dl=5_sam_0t0c.pt'
  sam_checkpoint: 'sam_checkpoint/sam_vit_b_01ec64.pth'

# Visualization Parameters
visualization:
  train_sample_interval: 50
  val_sample_interval: 50

# Weights & Biases Configuration
wandb:
  project: "WSSS"
  entity: "joshlicoding-university-of-waterloo"
  log_visualizations: false
