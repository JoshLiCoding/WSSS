hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: False

# Model Parameters
model:
  num_classes: 21
  pretrained_backbone: true  # ImageNet ResNet101 weights

# Training Parameters
training:
  batch_size: 16
  num_epochs: 0
  learning_rate: 0.001  # 10x on the ASPP head weights, 20x on its biases
  weight_decay: 0.0001
  momentum: 0.9
  ignore_index: 255
  validation_interval: 2
  train_only: false
  poly_lr: true
  num_workers: 4

# Loss Parameters
loss:
  contour_method: 'fastsam'  # 'sam', 'fastsam', 'slic', 'gt'

# Pseudo-label Parameters
pseudolabel:
  dir: 'pseudolabels/${dataset.dataset_name}_dinov2_${pseudolabel.head}'
  backbone: 'dinov2_vitb14_reg'  # registers keep artifact tokens out of the patch grid
  dinov2_location: null  # local facebookresearch/dinov2 clone for offline runs; null = torch.hub
  image_size: 448   # must be a multiple of 14; the patch grid is image_size / 14 = 32
  temperature: 0.3  # softmax temperature; the cached CAMs span [0, 1], so this is ~5 logits
  batch_size: 8

  # Per-patch classification head, trained on the image-level tags. 'cosine' scores unit class
  # prototypes against normalized tokens; 'linear' is the classic CAM 1x1 conv with a bias.
  head: 'linear'          # 'cosine' | 'linear'
  head_path: '${directories.output}/${directories.checkpoints}/${dataset.dataset_name}_dinov2_${pseudolabel.head}.pt'
  head_epochs: 4
  head_batch_size: 32
  head_lr: 0.001
  head_weight_decay: 0.0001
  logit_scale: 10.0       # initial scale on the cosine logits; unused by the linear head

  # CAM extraction
  cam_scales: [1.0]
  cam_flip: true
  # Background channel level, in the CAMs' own [0, 1] units -- the foreground/background
  # threshold and the main knob to tune. Usually 0.3-0.45; lower grows the foreground. Scaled
  # down per-patch by CLS attention (see cls_attention_hook), so this is the level only where
  # the backbone sees no salient object at all.
  bg_score: 0.2

# Boundary Parameters
boundary:
  dir: 'boundaries/${dataset.dataset_name}_${loss.contour_method}'

# Dataset Parameters
dataset:
  dataset_name: 'voc'
  root: './datasets'
  resize_size: 448
  # Resolution the losses are computed at. 56 = resize_size / 8 is DeepLabV2's native output
  # stride; a larger value (e.g. 112) bilinearly upsamples the logits first, which makes the
  # fixed 5-pixel dilation in the Potts affinity cover less of the image.
  label_size: 56

# Directory Structure
directories:
  output: 'output_dinov2_w_deeplab'
  checkpoints: 'checkpoints'
  visualizations: 'vis_${training.num_epochs}epochs_w=0_bg=0_cce_lin'

# File Paths
paths:
  model_checkpoint: 'output_dinov2_w_deeplab/checkpoints/4epochs_w=0_bg=0.pt'
  model: 'output_dinov2_w_deeplab/checkpoints/${training.num_epochs}epochs_w=0_bg=0_cce_lin.pt'

# Visualization Parameters
visualization:
  train_sample_interval: 50
  val_sample_interval: 50

# Weights & Biases Configuration
wandb:
  project: "WSSS"
  entity: "joshlicoding-university-of-waterloo"
  log_visualizations: false
